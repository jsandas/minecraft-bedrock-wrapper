# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

archives:
  - id: minecraft-bedrock-wrapper
    builds:
      - minecraft-bedrock-wrapper
    format: tar.gz

builds:
  - id: minecraft-bedrock-wrapper
    binary: minecraft-bedrock-wrapper
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
    goos:
      - linux
    main: ./cmd/minecraft-bedrock-wrapper
    no_unique_dist_dir: true

nfpms:
  - id: minecraft-bedrock-wrapper
    maintainer: Jsandas
    license: "MIT"
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    dependencies:
      - systemd
      - adduser
    package_name: minecraft-bedrock-wrapper
    contents:
      - src: build/contrib/minecraft-bedrock-wrapper.service
        dst: /etc/systemd/system/minecraft-bedrock-wrapper.service
        type: "config"
      - src: build/contrib/minecraft-bedrock-wrapper.default
        dst: /etc/default/minecraft-bedrock-wrapper
        type: "config|noreplace"
        file_info:
          mode: 0640
          owner: minecraft
          group: minecraft
      - dst: /opt/minecraft
        type: dir
        file_info:
          mode: 0755
          owner: minecraft
          group: minecraft
    scripts:
      preinstall: build/scripts/preinst
      postinstall: build/scripts/postinst
      preremove: build/scripts/prerm

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: true
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
