name: Quality
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    permissions:
      contents: read
    name: Lint Checks
    uses: jsandas/github-actions/.github/workflows/golang-lint.yml@732cf541b4a3b9057e47ca316fa4621756106b49
    with:
      golangci_lint_version: v2.15.0

  security:
    permissions:
      contents: read
      security-events: write
    name: Security Checks
    uses: jsandas/github-actions/.github/workflows/golang-security.yml@732cf541b4a3b9057e47ca316fa4621756106b49